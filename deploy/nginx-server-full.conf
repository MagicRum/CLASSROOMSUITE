# 宝塔面板 Nginx 伪静态配置示例
# 宝塔面板 → 网站 → 设置 → 配置文件
# 把以下 server {} 块中的 location / 替换即可

server {
    listen 80;
    server_name 你的域名或IP;
    index index.php index.html;
    root /www/wwwroot/你的域名/public;   # 注意：根目录指向 public/！

    # ThinkPHP 伪静态
    location / {
        if (!-e $request_filename){
            rewrite  ^(.*)$  /index.php?s=$1  last;
        }
    }

    # PHP 处理
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-80.sock;  # 根据实际 PHP 版本调整
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 禁止访问敏感目录
    location ~ /(vendor|runtime|database|config|route|app)/ {
        deny all;
    }

    # 禁止访问 .htaccess / .env
    location ~ /\.(htaccess|env) {
        deny all;
    }

    # 禁止访问备份文件
    location ~* \.(bak|backup|old|orig|sql)$ {
        deny all;
    }

    # 静态资源缓存
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        access_log off;
    }
}
