{extend name="admin/layout/index" /}
{block name="title"}导入试题库{/block}
{block name="content"}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Excel 导入试题库</h4>
    <a class="btn btn-outline-secondary" href="/admin/Question/index">返回列表</a>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><strong>上传试题文件</strong></div>
            <div class="card-body">
                <form id="importForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">选择 Excel / CSV 文件</label>
                        <input type="file" name="file" class="form-control" accept=".xlsx,.xls,.csv" required>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-upload"></i> 开始导入</button>
                </form>
                <div id="importResult" class="mt-3"></div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><strong>模板说明</strong></div>
            <div class="card-body">
                <table class="table table-sm table-bordered">
                    <tr><th>列</th><th>含义</th></tr>
                    <tr><td>A</td><td>题目</td></tr>
                    <tr><td>B</td><td>题型(1单选/2多选/3判断)</td></tr>
                    <tr><td>C~F</td><td>选项A/B/C/D（判断可留空）</td></tr>
                    <tr><td>G</td><td>正确答案（A/B/C/D）</td></tr>
                    <tr><td>H</td><td>分值（默认5）</td></tr>
                    <tr><td>I</td><td>难度（1简单/2中等/3困难）</td></tr>
                    <tr><td>J</td><td>分类（可选）</td></tr>
                </table>
                <a class="btn btn-success" href="/admin/Question/template"><i class="bi bi-download"></i> 下载导入模板</a>
            </div>
        </div>
    </div>
</div>
{/block}
{block name="js"}
<script>
document.getElementById('importForm').addEventListener('submit',function(e){
    e.preventDefault();
    var fd = new FormData(this);
    fetch('/admin/Question/import',{method:'POST',body:fd})
        .then(r=>r.json()).then(d=>{
            showAlert(d.msg,d.code===1?'success':'danger');
            if(d.data && d.data.errors){
                var html = '<div class="mt-3"><strong>错误示例：</strong><ul class="small text-danger">';
                d.data.errors.forEach(function(err){ html += '<li>'+err+'</li>'; });
                html += '</ul></div>';
                document.getElementById('importResult').innerHTML = html;
            }
            if(d.code===1) setTimeout(function(){location.reload();},1500);
        });
});
</script>
{/block}
