{extend name="admin/layout/index" /}
{block name="title"}{if $student}编辑学生{else}添加学生{/if}{/block}
{block name="content"}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">{if $student}编辑学生{else}添加学生{/if}</h4>
    <a class="btn btn-outline-secondary" href="/admin/Student/index">返回列表</a>
</div>
<div class="card col-md-6">
    <div class="card-body">
        <form id="studentForm">
            <input type="hidden" name="id" value="{$student.id|default=0}">
            <div class="mb-3">
                <label class="form-label">学号 *</label>
                <input type="text" name="student_no" class="form-control" value="{$student.student_no|default=''}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">姓名 *</label>
                <input type="text" name="name" class="form-control" value="{$student.name|default=''}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">班级 *</label>
                <select name="class_id" class="form-select" required>
                    <option value="">请选择班级</option>
                    {volist name="classes" id="c"}
                    <option value="{$c.id}" {if isset($student.class_id) && $student.class_id==$c.id}selected{/if}>{$c.class_name}</option>
                    {/volist}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">手机号</label>
                <input type="text" name="phone" class="form-control" value="{$student.phone|default=''}" placeholder="可选">
            </div>
            <button type="submit" class="btn btn-primary">保存</button>
        </form>
    </div>
</div>
{/block}
{block name="js"}
<script>
document.getElementById('studentForm').addEventListener('submit', function(e){
    e.preventDefault();
    var fd = new FormData(this);
    fetch('/admin/Student/save', {method:'POST', body:fd})
        .then(r=>r.json()).then(d=>{
            showAlert(d.msg, d.code===1?'success':'danger');
            if(d.code===1 && d.url) setTimeout(function(){ location.href=d.url; },800);
        });
});
</script>
{/block}
