# Nginx 伪静态规则
# 使用方法：宝塔面板 → 网站 → 设置 → 伪静态 → 粘贴以下内容并保存

location / {
    if (!-e $request_filename){
        rewrite  ^(.*)$  /index.php?s=$1  last;   break;
    }
}

# 禁止访问敏感目录
location ~ /(vendor|runtime|database|config|route)/ {
    deny all;
}

# 禁止访问 .htaccess / .env
location ~ /\.(htaccess|env) {
    deny all;
}

# 禁止访问备份文件
location ~* \.(bak|backup|old|orig|sql)$ {
    deny all;
}
