{extend name="admin/layout/index" /}
{block name="title"}管理员登录 - 抽题系统{/block}
{block name="head"}
<style>
    body { min-height:100vh; display:flex; align-items:center; }
    .login-card {
        width:400px; margin:auto;
        border:1px solid rgba(255,255,255,.09); border-radius:16px;
        background: #1E1F22;
        box-shadow:0 24px 70px rgba(0,0,0,.45);
        animation: cardIn .6s cubic-bezier(.22,.8,.36,1) both;
    }
    @keyframes cardIn {
        0% { opacity: 0; transform: translateY(24px) scale(.97); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .login-card .card-body { padding:40px; }
    .login-card h3 { color:#fff; font-weight:700; }
    .login-brand { display:flex; flex-direction:column; align-items:center; gap:12px; }
    .login-glyph { width:34px; height:34px; display:block; color:var(--jb-text); }
    .login-logo {
        font-family: "Space Grotesk", "Inter", sans-serif;
        font-size: 26px; font-weight: 700; letter-spacing: .14em;
        color: var(--jb-text); line-height: 1; margin: 0 auto;
    }
    .login-card .btn-primary { border-radius:8px; font-weight:600; }
    .login-card .form-control { padding:12px 16px; }
    .sidebar { display:none !important; }
    .main-content { width:100%; }
</style>
{/block}
{block name="content"}
<div class="card login-card">
    <div class="card-body">
        <div class="text-center mb-4">
            <div class="login-brand">
                <svg class="login-glyph" viewBox="0 0 40 40" aria-hidden="true">
                    <rect x="2" y="2" width="36" height="36" rx="9" fill="#A855F7"/>
                    <path d="M27.3 12.2A11 11 0 1 0 27.3 27.8" fill="none" stroke="#FFFFFF" stroke-width="4.4"/>
                </svg>
                <div class="login-logo">QTS</div>
            </div>
            <h3 class="mt-3">抽题系统</h3>
            <p class="text-muted">管理员登录</p>
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control" placeholder="请输入管理员账号" required>
            </div>
            <div class="mb-4">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">登录</button>
        </form>

        <div class="d-flex justify-content-between mt-4">
            <a href="/" style="color:var(--jb-text-dim);font-size:13px;text-decoration:none;">返回首页</a>
            <a href="/student/login" style="color:var(--jb-text-dim);font-size:13px;text-decoration:none;">学生入口</a>
        </div>
    </div>
</div>
{/block}
{block name="js"}
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var form = this;
    var btn = form.querySelector('button');
    btn.disabled = true; btn.textContent = '登录中...';

    var fd = new FormData(form);
    fetch('/admin/Login/doLogin', { method:'POST', body:fd })
        .then(r=>r.json())
        .then(data=>{
            btn.disabled = false; btn.textContent = '登录';
            if(data.code===1){
                showAlert('登录成功，正在跳转...','success');
                setTimeout(function(){ location.href = data.url; }, 800);
            } else {
                showAlert(data.msg,'danger');
            }
        })
        .catch(function(){ btn.disabled=false; showAlert('网络错误','danger'); });
});
</script>
{/block}
