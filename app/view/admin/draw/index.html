{extend name="admin/layout/index" /}
{block name="title"}随机抽题{/block}
{block name="head"}
<style>
    .draw-stage {
        max-width: 860px; margin: 10px auto;
        border: 1px solid rgba(255,255,255,.09);
        border-radius: 16px;
        background: #17171B;
        box-shadow: 0 12px 40px rgba(0,0,0,.35);
        padding: 44px 40px;
        text-align: center;
    }
    .draw-stage h3 { color: #fff; }
    .btn-draw {
        background: #A855F7;
        border: none; border-radius: 8px;
        font-size: 20px; font-weight: 600; letter-spacing: 1px;
        padding: 16px 56px; color: #fff;
        transition: background .15s ease;
        cursor: pointer;
    }
    .btn-draw:hover { background: #C084FC; }
    .btn-draw:disabled { background: #222227; color: rgba(255,255,255,.45); cursor: not-allowed; }
    .drawing-state { font-size: 16px; }
    .draw-dots span { animation: dotBlink 1.2s infinite; }
    .draw-dots span:nth-child(2) { animation-delay: .2s; }
    .draw-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dotBlink { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }

    .roll-window {
        margin: 28px auto 0;
        max-width: 560px;
        border-radius: 14px;
        background: #0B0B0D;
        border: 1px solid rgba(255,255,255,.09);
        box-shadow: inset 0 2px 14px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
        padding: 26px 24px;
        overflow: hidden;
        position: relative;
    }
    .roll-window::before, .roll-window::after {
        content: ''; position: absolute; left: 0; right: 0; height: 24px; z-index: 2; pointer-events: none;
    }
    .roll-window::before { top: 0; background: linear-gradient(180deg, rgba(11,11,13,.95), transparent); }
    .roll-window::after { bottom: 0; background: linear-gradient(0deg, rgba(11,11,13,.95), transparent); }
    .roll-label {
        font-size: 12px; font-weight: 600; letter-spacing: 1px;
        color: rgba(255,255,255,.4); text-transform: uppercase; margin-bottom: 10px;
    }
    .roll-text {
        font-size: 20px; font-weight: 600; color: rgba(255,255,255,.9);
        min-height: 56px; display: flex; align-items: center; justify-content: center;
        text-align: center; line-height: 1.5;
    }
    .roll-text.rolling { color: #C084FC; }

    .q-card {
        border: 1px solid rgba(255,255,255,.09);
        border-radius: 14px;
        background: #232427;
        box-shadow: 0 8px 28px rgba(0,0,0,.3);
        margin-bottom: 18px;
        text-align: left;
        animation: cardSpringIn .65s cubic-bezier(.34,1.45,.64,1) both;
    }
    @keyframes cardSpringIn {
        0% { opacity: 0; transform: translateY(44px) scale(.92); }
        60% { opacity: 1; transform: translateY(-6px) scale(1.02); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .q-badge {
        display: inline-block; padding: 4px 14px; border-radius: 20px;
        font-size: 13px; font-weight: 600; margin-right: 8px;
    }
    .q-option {
        padding: 12px 16px;
        border: 1.5px solid #3C3F41;
        background: #2B2D30;
        color: rgba(255,255,255,.88);
        border-radius: 10px; margin-bottom: 8px;
        font-size: 16px;
    }
</style>
{/block}
{block name="content"}
<div class="draw-stage">
    <h3 style="font-weight:700;letter-spacing:2px;">课堂随机抽题</h3>
    <p class="mb-4" style="color:rgba(255,255,255,.55);">题库共 <strong style="color:#C084FC;">{$poolCount}</strong> 道题，每次随机抽取 2 道</p>

    {if $poolCount >= 2}
    <div id="drawArea">
        <button id="drawBtn" class="btn-draw">
            <i class="bi bi-shuffle me-2"></i> 开始抽题
        </button>

        <div id="rollWindow" class="roll-window" style="display:none;">
            <div class="roll-label"><i class="bi bi-arrow-repeat me-1"></i>正在从题库中抽取</div>
            <div id="rollText" class="roll-text rolling">...</div>
        </div>
    </div>
    <div id="resultArea"></div>
    {else}
    <div class="alert alert-danger" style="border-radius:14px;">
        题库不足 2 道题，请先到「试题管理」导入试题
    </div>
    {/if}
</div>
{/block}
{block name="js"}
<script>
var QUESTION_POOL = {$poolJson|raw};

var drawBtn = document.getElementById('drawBtn');
if (drawBtn) {
    drawBtn.addEventListener('click', function(){
        var btn = this;
        btn.disabled = true;
        btn.classList.add('drawing-state');
        btn.innerHTML = '<i class="bi bi-dice-5"></i> 系统正在抽题<span class="draw-dots"><span>.</span><span>.</span><span>.</span></span>';
        document.getElementById('resultArea').innerHTML = '';

        var rollWindow = document.getElementById('rollWindow');
        var rollText = document.getElementById('rollText');
        rollWindow.style.display = 'block';
        var rollTimer = setInterval(function(){
            var q = QUESTION_POOL[Math.floor(Math.random() * QUESTION_POOL.length)];
            rollText.textContent = q.title;
        }, 100);

        setTimeout(function(){
            clearInterval(rollTimer);

            fetch('/admin/draw/go', {method:'POST'})
                .then(function(r){ return r.json(); })
                .then(function(d){
                    if (d.code === 1) {
                        rollWindow.style.display = 'none';
                        renderQuestions(d.data);
                    } else {
                        showAlert(d.msg, 'danger');
                        resetBtn();
                    }
                })
                .catch(function(){
                    showAlert('网络错误', 'danger');
                    resetBtn();
                });
        }, 3000);

        function resetBtn(){
            rollWindow.style.display = 'none';
            btn.disabled = false;
            btn.classList.remove('drawing-state');
            btn.innerHTML = '<i class="bi bi-shuffle me-2"></i> 开始抽题';
        }
    });
}

function renderQuestions(data){
    var area = document.getElementById('resultArea');
    var html = '<div style="margin-top:30px;">';

    data.questions.forEach(function(q, idx){
        html += '<div class="q-card" style="animation-delay:'+(idx*0.3)+'s;padding:26px;">'
              + '<div class="mb-3">'
              + '<span class="q-badge" style="background:#A855F7;color:#fff;">第'+(idx+1)+'题</span>'
              + '<span class="q-badge" style="background:rgba(168,85,247,.15);color:#D8B4FE;">'+q.type_name+'</span>'
              + '</div>'
              + '<p style="font-size:19px;font-weight:600;margin-bottom:16px;line-height:1.7;color:#fff;">'+q.title+'</p>';

        if(q.question_type==3){
            html += '<div class="q-option"><strong>A.</strong> 正确</div>'
                  + '<div class="q-option"><strong>B.</strong> 错误</div>';
        } else {
            ['option_a','option_b','option_c','option_d'].forEach(function(opt, i){
                var val = String.fromCharCode(65+i);
                if(q[opt]){
                    html += '<div class="q-option"><strong>'+val+'.</strong> '+q[opt]+'</div>';
                }
            });
        }
        html += '</div>';
    });

    html += '<button class="btn-draw" style="font-size:17px;padding:14px 44px;" onclick="location.reload()">'
          + '<i class="bi bi-arrow-repeat me-2"></i> 再抽一次</button></div>';

    area.innerHTML = html;
    document.getElementById('drawArea').style.display = 'none';
    area.scrollIntoView({behavior:'smooth', block:'start'});
}
</script>
{/block}
